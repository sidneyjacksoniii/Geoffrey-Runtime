<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244860"/></marker><style>.title{font:700 22px Arial;fill:#111}.sub{font:17px Arial;fill:#111}.h1{font:700 42px Arial;fill:#111}.lead{font:23px Arial;fill:#475569}.foot{font:18px Arial;fill:#64748B}.arrow{stroke:#244860;stroke-width:4;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="90" class="h1">Governed distributed execution</text><text x="80" y="135" class="lead">Control, execution, and evidence remain separate trust boundaries</text><rect x="70" y="230" width="270" height="125" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="205.0" y="288.5" text-anchor="middle" class="title">Authenticated source</text><text x="205.0" y="316.5" text-anchor="middle" class="sub">scoped request</text><line x1="340" y1="292.5" x2="372" y2="292.5" class="arrow"/><rect x="390" y="230" width="270" height="125" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="525.0" y="288.5" text-anchor="middle" class="title">Intake</text><text x="525.0" y="316.5" text-anchor="middle" class="sub">schema · freshness · replay</text><line x1="660" y1="292.5" x2="692" y2="292.5" class="arrow"/><rect x="710" y="230" width="270" height="125" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="845.0" y="288.5" text-anchor="middle" class="title">Governor</text><text x="845.0" y="316.5" text-anchor="middle" class="sub">policy · access · state</text><line x1="980" y1="292.5" x2="1012" y2="292.5" class="arrow"/><rect x="1030" y="230" width="270" height="125" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="1165.0" y="288.5" text-anchor="middle" class="title">Router</text><text x="1165.0" y="316.5" text-anchor="middle" class="sub">registered executor</text><line x1="1300" y1="292.5" x2="1332" y2="292.5" class="arrow"/><rect x="1350" y="230" width="270" height="125" rx="16" fill="#EEF6EE" stroke="#244860" stroke-width="3"/><text x="1485.0" y="288.5" text-anchor="middle" class="title">Local executor</text><text x="1485.0" y="316.5" text-anchor="middle" class="sub">fixed adapter / Shortcut</text><rect x="980" y="520" width="270" height="125" rx="16" fill="#FFF3D8" stroke="#8B6420" stroke-width="3"/><text x="1115.0" y="578.5" text-anchor="middle" class="title">Transport ack</text><text x="1115.0" y="606.5" text-anchor="middle" class="sub">recorded, not success</text><rect x="1325" y="520" width="270" height="125" rx="16" fill="#FFF3D8" stroke="#8B6420" stroke-width="3"/><text x="1460.0" y="578.5" text-anchor="middle" class="title">Terminal receipt</text><text x="1460.0" y="606.5" text-anchor="middle" class="sub">correlated + validated</text><rect x="1325" y="755" width="270" height="125" rx="16" fill="#FFF3D8" stroke="#8B6420" stroke-width="3"/><text x="1460.0" y="813.5" text-anchor="middle" class="title">Canonical state</text><text x="1460.0" y="841.5" text-anchor="middle" class="sub">dashboard + audit</text><rect x="95" y="755" width="350" height="125" rx="16" fill="#FBEAEA" stroke="#913D3D" stroke-width="3"/><text x="270.0" y="813.5" text-anchor="middle" class="title">Deny / expire / quarantine</text><text x="270.0" y="841.5" text-anchor="middle" class="sub">fail closed before effect</text><line x1="1485" y1="355" x2="1458" y2="502" class="arrow"/><line x1="1458" y1="645" x2="1458" y2="737" class="arrow"/><line x1="1115" y1="645" x2="1307" y2="812" stroke="#8B6420" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="900" y="700" class="title" fill="#8B6420">non-authoritative</text><line x1="525" y1="355" x2="350" y2="737" stroke="#913D3D" stroke-width="4" marker-end="url(#arrow)"/><text x="80" y="950" class="foot">Sanitized architecture — no private endpoints, identifiers, or infrastructure detail</text></svg>
