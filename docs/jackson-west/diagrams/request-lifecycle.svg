<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244860"/></marker><style>.title{font:700 22px Arial;fill:#111}.sub{font:17px Arial;fill:#111}.h1{font:700 42px Arial;fill:#111}.lead{font:23px Arial;fill:#475569}.panel{font:700 28px Arial;fill:#111}.item{font:20px Arial;fill:#222}</style></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="90" class="h1">Request lifecycle and proof boundary</text><text x="80" y="135" class="lead">Every state transition is gated; transport never authorizes success</text><rect x="80" y="250" width="205" height="170" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="182.5" y="307.0" text-anchor="middle" class="title">1  Create</text><text x="182.5" y="339.0" text-anchor="middle" class="sub">authenticated source</text><text x="182.5" y="363.0" text-anchor="middle" class="sub">correlation ID</text><line x1="285" y1="335" x2="307" y2="335" stroke="#244860" stroke-width="4" marker-end="url(#arrow)"/><rect x="325" y="250" width="205" height="170" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="427.5" y="307.0" text-anchor="middle" class="title">2  Validate</text><text x="427.5" y="339.0" text-anchor="middle" class="sub">schema · time · replay</text><text x="427.5" y="363.0" text-anchor="middle" class="sub">credential · identity</text><line x1="530" y1="335" x2="552" y2="335" stroke="#244860" stroke-width="4" marker-end="url(#arrow)"/><rect x="570" y="250" width="205" height="170" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="672.5" y="307.0" text-anchor="middle" class="title">3  Authorize</text><text x="672.5" y="339.0" text-anchor="middle" class="sub">policy · access</text><text x="672.5" y="363.0" text-anchor="middle" class="sub">current state</text><line x1="775" y1="335" x2="797" y2="335" stroke="#244860" stroke-width="4" marker-end="url(#arrow)"/><rect x="815" y="250" width="205" height="170" rx="16" fill="#EAF2F8" stroke="#244860" stroke-width="3"/><text x="917.5" y="307.0" text-anchor="middle" class="title">4  Resolve</text><text x="917.5" y="339.0" text-anchor="middle" class="sub">eligible registered</text><text x="917.5" y="363.0" text-anchor="middle" class="sub">executor</text><line x1="1020" y1="335" x2="1042" y2="335" stroke="#244860" stroke-width="4" marker-end="url(#arrow)"/><rect x="1060" y="250" width="205" height="170" rx="16" fill="#EEF6EE" stroke="#244860" stroke-width="3"/><text x="1162.5" y="307.0" text-anchor="middle" class="title">5  Execute</text><text x="1162.5" y="339.0" text-anchor="middle" class="sub">atomic handoff</text><text x="1162.5" y="363.0" text-anchor="middle" class="sub">local adapter</text><line x1="1265" y1="335" x2="1287" y2="335" stroke="#244860" stroke-width="4" marker-end="url(#arrow)"/><rect x="1305" y="250" width="205" height="170" rx="16" fill="#FFF3D8" stroke="#244860" stroke-width="3"/><text x="1407.5" y="307.0" text-anchor="middle" class="title">6  Receive</text><text x="1407.5" y="339.0" text-anchor="middle" class="sub">terminal receipt</text><text x="1407.5" y="363.0" text-anchor="middle" class="sub">correlation check</text><line x1="1510" y1="335" x2="1532" y2="335" stroke="#244860" stroke-width="4" marker-end="url(#arrow)"/><rect x="1550" y="250" width="205" height="170" rx="16" fill="#FFF3D8" stroke="#244860" stroke-width="3"/><text x="1652.5" y="307.0" text-anchor="middle" class="title">7  Publish</text><text x="1652.5" y="339.0" text-anchor="middle" class="sub">canonical state</text><text x="1652.5" y="363.0" text-anchor="middle" class="sub">and audit</text><rect x="120" y="565" width="670" height="225" rx="20" fill="#FBEAEA" stroke="#913D3D" stroke-width="3"/><text x="160" y="640" class="panel">Fail closed</text><rect x="930" y="565" width="720" height="225" rx="20" fill="#FFF3D8" stroke="#8B6420" stroke-width="3"/><text x="970" y="640" class="panel">Evidence handling</text><text x="165" y="680" class="item">• malformed or stale</text><text x="165" y="711" class="item">• credential or policy denial</text><text x="165" y="742" class="item">• duplicate or mismatched ID</text><text x="165" y="773" class="item">• missing / ambiguous executor</text><text x="975" y="680" class="item">• transport ack → record only</text><text x="975" y="711" class="item">• valid terminal receipt → publish</text><text x="975" y="742" class="item">• timeout / mismatch → pending or failed</text><text x="975" y="773" class="item">• late evidence → reconcile or quarantine</text><rect x="320" y="900" width="1160" height="125" rx="18" fill="#EEF6EE" stroke="#2F6543" stroke-width="3"/><text x="365" y="955" class="panel">Recovery is a new validated transition—not a rewrite of earlier evidence</text><text x="365" y="995" class="item">Fresh heartbeat, corrected registration, new request ID, or correlated late receipt</text></svg>
